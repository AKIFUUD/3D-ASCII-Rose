<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D ASCII Rose</title>
    <!-- Подключаем Tailwind CSS для аккуратного минималистичного интерфейса -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Базовые стили для полноэкранного чёрного холста без полос прокрутки */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
            touch-action: none; /* Отключаем стандартный скролл/зум браузера на тачскринах */
        }
        canvas:active {
            cursor: grabbing;
        }
        /* Плавная анимация появления/скрытия панели управления */
        .controls-panel {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .controls-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
        }
        /* Стилизация ползунков */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 4px;
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fb7185;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(251, 113, 133, 0.8);
        }
    </style>
</head>
<body class="bg-black text-neutral-300">

    <!-- Основной холст для рендеринга ASCII-графики -->
    <canvas id="asciiCanvas"></canvas>

    <!-- Кнопка сворачивания/разворачивания панели настроек в правом нижнем углу -->
    <button id="toggleControlsBtn"
            title="Настройки"
            class="fixed bottom-4 right-4 z-20 p-3 rounded-full bg-neutral-900/70 hover:bg-neutral-800/90 border border-white/10 text-rose-400 backdrop-blur-md transition-all shadow-lg active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>

    <!-- Минималистичная полупрозрачная панель управления -->
    <div id="controlsPanel" class="controls-panel controls-hidden fixed bottom-16 right-4 z-20 w-64 p-4 rounded-2xl bg-neutral-950/85 border border-white/10 backdrop-blur-md shadow-2xl text-xs space-y-3">
        <div class="flex items-center justify-between border-b border-white/10 pb-2">
            <span class="font-semibold tracking-wider text-rose-400 uppercase">ASCII Rose</span>
            <button id="resetViewBtn" class="px-2 py-1 rounded-lg bg-white/5 hover:bg-white/15 text-neutral-300 transition">Сброс</button>
        </div>

        <!-- Скорость автовращения -->
        <div class="space-y-1">
            <div class="flex justify-between text-neutral-400">
                <span>Вращение</span>
                <span id="speedVal">1.0x</span>
            </div>
            <input id="speedSlider" type="range" min="0" max="3" step="0.1" value="1.0" class="w-full">
        </div>

        <!-- Размер символов (детализация) -->
        <div class="space-y-1">
            <div class="flex justify-between text-neutral-400">
                <span>Размер символов</span>
                <span id="fontSizeVal">10px</span>
            </div>
            <input id="fontSizeSlider" type="range" min="7" max="16" step="1" value="10" class="w-full">
        </div>

        <!-- Выбор палитры оттенков розы -->
        <div class="space-y-1">
            <span class="text-neutral-400 block">Палитра бутона</span>
            <div class="grid grid-cols-3 gap-1.5 pt-1">
                <button data-palette="crimson" class="palette-btn py-1.5 rounded-lg bg-rose-500/20 border border-rose-500/50 text-rose-300 font-medium">Алая</button>
                <button data-palette="pink" class="palette-btn py-1.5 rounded-lg bg-white/5 border border-white/10 text-neutral-400 hover:text-pink-300">Нежная</button>
                <button data-palette="gold" class="palette-btn py-1.5 rounded-lg bg-white/5 border border-white/10 text-neutral-400 hover:text-amber-300">Золото</button>
            </div>
        </div>

        <p class="text-[10px] text-neutral-500 pt-1 leading-relaxed">
            Тяните мышью или пальцем для вращения, колесо мыши / щипок — для масштаба.
        </p>
    </div>

    <script>
        /**
         * 3D ASCII Rose Engine
         * Параметрическая генерация объёмной розы (бутон из спиральных лепестков, чашелистики, стебель и листья)
         * с Z-буфером и раскраской символов в реальном времени на HTML5 Canvas.
         */
        window.onload = function () {
            const canvas = document.getElementById('asciiCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // Набор символов по возрастанию визуальной плотности (от разреженных точек до плотных знаков и цифр)
            const ASCII_CHARS = " .,:;-~=+*!#%@0123456789$&";

            // Состояние камеры и анимации
            const state = {
                rotX: 0.38,          // Наклон розы к зрителю, чтобы было видно и глубину бутона, и стебель
                rotY: 0.0,           // Текущий угол поворота вокруг вертикальной оси
                rotZ: -0.12,         // Лёгкий художественный наклон вбок
                autoSpeed: 1.0,      // Скорость автовращения
                zoom: 1.0,           // Масштаб камеры
                fontSize: 10,        // Размер шрифта символов (в пикселях)
                palette: 'crimson',  // Текущая цветовая схема бутона
                isDragging: false,
                lastX: 0,
                lastY: 0,
                lastPinchDist: 0,
                velX: 0,
                velY: 0
            };

            // Палитры цветов для лепестков (RGB для теней, середины и бликов)
            const PALETTES = {
                crimson: {
                    deep: [95, 8, 28],
                    mid: [220, 28, 72],
                    bright: [255, 130, 160],
                    highlight: [255, 225, 232]
                },
                pink: {
                    deep: [125, 24, 75],
                    mid: [244, 114, 182],
                    bright: [253, 186, 220],
                    highlight: [255, 245, 250]
                },
                gold: {
                    deep: [115, 45, 10],
                    mid: [235, 125, 30],
                    bright: [253, 200, 85],
                    highlight: [255, 250, 220]
                }
            };

            // Предварительно вычисленное облако 3D-точек розы (координаты, нормаль, тип части, градиент)
            let rosePoints = [];

            /**
             * Линейная интерполяция между двумя RGB-цветами
             */
            function lerpColor(c1, c2, t) {
                const clamped = Math.max(0, Math.min(1, t));
                return [
                    Math.round(c1[0] + (c2[0] - c1[0]) * clamped),
                    Math.round(c1[1] + (c2[1] - c1[1]) * clamped),
                    Math.round(c1[2] + (c2[2] - c1[2]) * clamped)
                ];
            }

            /**
             * Построение математической 3D-модели розы
             * Используется классическая параметрическая поверхность Пола Ниландера для бутона
             * и аналитические кривые для чашелистиков, стебля и зубчатых листьев.
             */
            function buildRoseGeometry() {
                const points = [];

                // 1. БУТОН РОЗЫ (спиральные слои лепестков)
                // u — параметр раскрытия от центра к внешним лепесткам (0..1)
                // v — угол закручивания по спирали (0..2*PI)
                const uSteps = 76;
                const vSteps = 135;
                const petalCount = 3.6; // Количество лепестков на один оборот спирали

                for (let i = 0; i <= uSteps; i++) {
                    const u = i / uSteps;
                    for (let j = 0; j < vSteps; j++) {
                        const v = (j / vSteps) * Math.PI * 2;

                        // Уравнение спиральной розы с раскрывающимися внешними лепестками
                        const xParam = 1 - 0.5 * Math.pow((5 / 4) * Math.pow(1 - ((petalCount * v) % (2 * Math.PI)) / Math.PI, 2) - 0.25, 2);
                        const phi = (Math.PI / 2) * Math.exp(-u / (2.2));
                        const yMod = 1.95 * Math.pow(u, 2) * Math.pow(1.27689 * u - 1, 2) * Math.sin(phi);
                        const r = xParam * (u * Math.sin(phi) + yMod * Math.cos(phi));

                        // Координаты точки бутона
                        const scaleBud = 1.38;
                        const px = r * Math.sin(v) * scaleBud;
                        const pz = r * Math.cos(v) * scaleBud;
                        // Смещаем бутон чуть вверх (y > 0)
                        const py = (xParam * (u * Math.cos(phi) - yMod * Math.sin(phi))) * scaleBud + 0.35;

                        // Приближённая нормаль для красивого объёмного освещения
                        // Внешние края лепестков смотрят наружу и слегка вверх
                        const nx = Math.sin(v) * (0.4 + 0.6 * u);
                        const ny = 0.55 - 0.35 * u + 0.25 * Math.cos(petalCount * v);
                        const nz = Math.cos(v) * (0.4 + 0.6 * u);
                        const nLen = Math.hypot(nx, ny, nz) || 1;

                        // Параметр глубины/края лепестка для цветового градиента
                        const edgeFactor = Math.min(1, Math.pow(u, 0.75) * 0.75 + Math.abs(Math.sin(petalCount * v * 0.5)) * 0.35);

                        points.push({
                            x: px,
                            y: py,
                            z: pz,
                            nx: nx / nLen,
                            ny: ny / nLen,
                            nz: nz / nLen,
                            part: 'petal',
                            factor: edgeFactor
                        });
                    }
                }

                // 2. ЧАШЕЛИСТИКИ (5 зелёных заострённых листиков прямо под бутоном)
                const sepalCount = 5;
                for (let s = 0; s < sepalCount; s++) {
                    const baseAngle = (s / sepalCount) * Math.PI * 2 + 0.3;
                    for (let t = 0; t <= 18; t++) {
                        const frac = t / 18; // от основания к кончику
                        const width = Math.sin(frac * Math.PI) * 0.16 * (1 - frac * 0.4);
                        for (let w = -4; w <= 4; w++) {
                            const wFrac = w / 4;
                            const angle = baseAngle + wFrac * width;
                            const rad = 0.18 + frac * 0.68;
                            // Чашелистики изгибаются сначала наружу, затем слегка вниз
                            const sy = 0.34 - Math.pow(frac, 1.6) * 0.28 + Math.sin(frac * Math.PI) * 0.06;
                            const sx = Math.sin(angle) * rad;
                            const sz = Math.cos(angle) * rad;

                            points.push({
                                x: sx,
                                y: sy,
                                z: sz,
                                nx: Math.sin(angle) * 0.5,
                                ny: 0.7,
                                nz: Math.cos(angle) * 0.5,
                                part: 'stem',
                                factor: 0.3 + frac * 0.5
                            });
                        }
                    }
                }

                // 3. СТЕБЕЛЬ (плавно изогнутый цилиндр вниз от бутона)
                const stemSteps = 95;
                const stemRadial = 14;
                for (let i = 0; i <= stemSteps; i++) {
                    const t = i / stemSteps; // 0 у бутона -> 1 внизу
                    const sy = 0.32 - t * 2.35;
                    // Лёгкий S-образный естественный изгиб стебля
                    const curveX = Math.sin(t * Math.PI * 1.3) * 0.14;
                    const curveZ = Math.cos(t * Math.PI * 1.1) * 0.08 - 0.08;
                    const radius = 0.055 + (1 - t) * 0.015;

                    for (let j = 0; j < stemRadial; j++) {
                        const theta = (j / stemRadial) * Math.PI * 2;
                        const nx = Math.cos(theta);
                        const nz = Math.sin(theta);
                        points.push({
                            x: curveX + nx * radius,
                            y: sy,
                            z: curveZ + nz * radius,
                            nx: nx,
                            ny: 0.1,
                            nz: nz,
                            part: 'stem',
                            factor: 0.25 + (1 - t) * 0.35
                        });
                    }
                }

                // 4. ЛИСТЬЯ НА СТЕБЛЕ (два резных листа на черешках с разных сторон)
                const leavesConfig = [
                    { startY: -0.45, dirAngle: 0.2, tilt: 0.35, scale: 0.85 },
                    { startY: -1.05, dirAngle: Math.PI + 0.45, tilt: 0.42, scale: 0.95 }
                ];

                leavesConfig.forEach(leaf => {
                    const stemT = (0.32 - leaf.startY) / 2.35;
                    const originX = Math.sin(stemT * Math.PI * 1.3) * 0.14;
                    const originZ = Math.cos(stemT * Math.PI * 1.1) * 0.08 - 0.08;

                    const cosA = Math.cos(leaf.dirAngle);
                    const sinA = Math.sin(leaf.dirAngle);

                    // Черешок листа
                    for (let p = 0; p <= 12; p++) {
                        const pf = p / 12;
                        const lx = pf * 0.38 * leaf.scale;
                        const ly = leaf.startY + pf * 0.14 * leaf.scale;
                        const lz = 0;

                        const rx = originX + lx * cosA - lz * sinA;
                        const rz = originZ + lx * sinA + lz * cosA;
                        points.push({
                            x: rx, y: ly, z: rz,
                            nx: 0, ny: 1, nz: 0,
                            part: 'stem',
                            factor: 0.4
                        });
                    }

                    // Пластина листа
                    const uLeaf = 26;
                    const vLeaf = 18;
                    for (let i = 0; i <= uLeaf; i++) {
                        const u = i / uLeaf; // вдоль листа (0..1)
                        // Форма заострённого овального листа с лёгкой зубчатостью по краю
                        const serration = 1 + 0.08 * Math.sin(u * Math.PI * 10);
                        const halfWidth = Math.sin(Math.pow(u, 0.75) * Math.PI) * 0.34 * leaf.scale * serration;

                        for (let j = -vLeaf / 2; j <= vLeaf / 2; j++) {
                            const v = j / (vLeaf / 2); // поперёк листа (-1..1)
                            const localDist = (0.36 + u * 0.85) * leaf.scale;
                            const localSide = v * halfWidth;
                            // Небольшой V-образный изгиб жилки и прогиб кончика вниз
                            const localY = leaf.startY + (0.14 + u * 0.22 - Math.pow(u, 2.2) * 0.25 + Math.abs(v) * 0.04) * leaf.scale;

                            const rx = originX + localDist * cosA - localSide * sinA;
                            const rz = originZ + localDist * sinA + localSide * cosA;

                            // Нормаль листа смотрит вверх и слегка в сторону изгиба
                            const nx = (-sinA * v * 0.4 + cosA * u * 0.3);
                            const ny = 0.88;
                            const nz = (cosA * v * 0.4 + sinA * u * 0.3);
                            const nLen = Math.hypot(nx, ny, nz) || 1;

                            points.push({
                                x: rx,
                                y: localY,
                                z: rz,
                                nx: nx / nLen,
                                ny: ny / nLen,
                                nz: nz / nLen,
                                part: 'leaf',
                                factor: 0.35 + (1 - Math.abs(v)) * 0.4 + u * 0.25
                            });
                        }
                    }
                });

                rosePoints = points;
            }

            // Параметры сетки символов на экране
            let cols = 0;
            let rows = 0;
            let charWidth = 6;
            let charHeight = 10;
            let zBuffer = new Float32Array(0);
            let charBuffer = [];
            let colorBuffer = [];

            /**
             * Пересчёт размеров Canvas и символьной сетки при изменении окна или размера шрифта
             */
            function resizeCanvas() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const width = window.innerWidth;
                const height = window.innerHeight;

                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                charHeight = state.fontSize;
                // Моноширинный шрифт имеет соотношение ширины к высоте ~0.6
                charWidth = Math.max(4, Math.floor(state.fontSize * 0.62));

                cols = Math.ceil(width / charWidth);
                rows = Math.ceil(height / charHeight);

                const totalCells = cols * rows;
                zBuffer = new Float32Array(totalCells);
                charBuffer = new Array(totalCells);
                colorBuffer = new Array(totalCells);
            }

            /**
             * Главный цикл отрисовки кадра
             */
            let lastTime = performance.now();

            function render(now) {
                const dt = Math.min((now - lastTime) / 1000, 0.1);
                lastTime = now;

                // Плавное автовращение и затухание инерции после перетаскивания
                if (!state.isDragging) {
                    state.rotY += state.autoSpeed * 0.65 * dt + state.velX;
                    state.rotX += state.velY;
                    state.velX *= 0.92;
                    state.velY *= 0.92;
                    // Ограничиваем угол наклона по вертикали, чтобы роза не переворачивалась вверх ногами бесконтрольно
                    state.rotX = Math.max(-1.2, Math.min(1.35, state.rotX));
                }

                // Очистка буферов Z-глубины и символов
                zBuffer.fill(-Infinity);
                charBuffer.fill(null);

                // Предварительный расчёт тригонометрии для матриц поворота
                const cosX = Math.cos(state.rotX), sinX = Math.sin(state.rotX);
                const cosY = Math.cos(state.rotY), sinY = Math.sin(state.rotY);
                const cosZ = Math.cos(state.rotZ), sinZ = Math.sin(state.rotZ);

                // Вектор источника света (сверху-справа-спереди)
                const lx = 0.45, ly = 0.72, lz = 0.52;
                const lLen = Math.hypot(lx, ly, lz);
                const lightX = lx / lLen, lightY = ly / lLen, lightZ = lz / lLen;

                // Масштаб проекции подстраиваем под меньшую сторону экрана (адаптивно для телефонов и ПК)
                const minScreenDim = Math.min(window.innerWidth, window.innerHeight);
                const baseScale = (minScreenDim * 0.34) * state.zoom;
                const cameraDist = 4.6;
                const centerX = cols * 0.5;
                // Небольшое смещение вверх, чтобы композиция бутон + стебель была идеально по центру
                const centerY = rows * 0.44;

                const activePalette = PALETTES[state.palette];
                const charLen = ASCII_CHARS.length - 1;

                // Проходим по всем 3D-точкам модели розы
                for (let i = 0; i < rosePoints.length; i++) {
                    const p = rosePoints[i];

                    // 1. Поворот вокруг оси Y (основное вращение розы)
                    const x1 = p.x * cosY - p.z * sinY;
                    const z1 = p.x * sinY + p.z * cosY;
                    const y1 = p.y;

                    // 2. Поворот вокруг оси X (наклон к зрителю)
                    const y2 = y1 * cosX - z1 * sinX;
                    const z2 = y1 * sinX + z1 * cosX;
                    const x2 = x1;

                    // 3. Лёгкий поворот вокруг оси Z
                    const x3 = x2 * cosZ - y2 * sinZ;
                    const y3 = x2 * sinZ + y2 * cosZ;
                    const z3 = z2;

                    // Перспективная проекция на экран
                    const depth = cameraDist + z3;
                    if (depth <= 0.2) continue;

                    const invDepth = 1 / depth;
                    const screenX = Math.floor(centerX + (x3 * baseScale * invDepth * cameraDist) / charWidth);
                    const screenY = Math.floor(centerY - (y3 * baseScale * invDepth * cameraDist) / charHeight);

                    if (screenX < 0 || screenX >= cols || screenY < 0 || screenY >= rows) continue;

                    const cellIdx = screenY * cols + screenX;

                    // Проверка Z-буфера: рисуем только самую ближнюю к камере точку в данной ячейке
                    if (z3 > zBuffer[cellIdx]) {
                        zBuffer[cellIdx] = z3;

                        // Поворачиваем нормаль точки тем же вращением для расчёта освещения
                        const nx1 = p.nx * cosY - p.nz * sinY;
                        const nz1 = p.nx * sinY + p.nz * cosY;
                        const ny1 = p.ny;

                        const ny2 = ny1 * cosX - nz1 * sinX;
                        const nz2 = ny1 * sinX + nz1 * cosX;
                        const nx2 = nx1;

                        const nx3 = nx2 * cosZ - ny2 * sinZ;
                        const ny3 = nx2 * sinZ + ny2 * cosZ;
                        const nz3 = nz2;

                        // Диффузное освещение + лёгкая подсветка по глубине (ambient + depth fog)
                        const dot = nx3 * lightX + ny3 * lightY + nz3 * lightZ;
                        const diffuse = Math.max(0, dot);
                        // Глубина добавляет контраст переднему плану
                        const depthShade = Math.max(0.15, Math.min(1.15, (z3 + 1.6) / 2.8));
                        const luminance = Math.min(1, (0.22 + diffuse * 0.78) * depthShade);

                        // Выбор ASCII-символа по яркости
                        const charIndex = Math.max(1, Math.min(charLen, Math.floor(luminance * charLen)));
                        charBuffer[cellIdx] = ASCII_CHARS[charIndex];

                        // Расчёт цвета символа в зависимости от части розы
                        let rgb;
                        if (p.part === 'petal') {
                            // Богатый градиент лепестков: от глубокого бархата в центре до ярких краёв и бликов
                            const tone = Math.min(1, luminance * 0.75 + p.factor * 0.35);
                            if (tone < 0.45) {
                                rgb = lerpColor(activePalette.deep, activePalette.mid, tone / 0.45);
                            } else if (tone < 0.82) {
                                rgb = lerpColor(activePalette.mid, activePalette.bright, (tone - 0.45) / 0.37);
                            } else {
                                rgb = lerpColor(activePalette.bright, activePalette.highlight, (tone - 0.82) / 0.18);
                            }
                        } else if (p.part === 'leaf') {
                            // Изумрудно-лесные оттенки листьев
                            const gTone = Math.min(1, luminance * 0.85 + p.factor * 0.25);
                            rgb = lerpColor([14, 58, 32], [74, 210, 120], gTone);
                        } else {
                            // Стебель и чашелистики
                            const sTone = Math.min(1, luminance * 0.8 + p.factor * 0.2);
                            rgb = lerpColor([18, 65, 34], [58, 175, 95], sTone);
                        }

                        colorBuffer[cellIdx] = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
                    }
                }

                // Заливаем фон чистым чёрным цветом (#000000)
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

                // Настраиваем моноширинный шрифт и отрисовываем символы
                ctx.font = `bold ${state.fontSize}px "Courier New", Courier, monospace`;
                ctx.textBaseline = 'top';

                let lastColor = '';
                for (let r = 0; r < rows; r++) {
                    const rowOffset = r * cols;
                    const py = r * charHeight;
                    for (let c = 0; c < cols; c++) {
                        const idx = rowOffset + c;
                        const ch = charBuffer[idx];
                        if (ch) {
                            const col = colorBuffer[idx];
                            if (col !== lastColor) {
                                ctx.fillStyle = col;
                                lastColor = col;
                            }
                            ctx.fillText(ch, c * charWidth, py);
                        }
                    }
                }

                requestAnimationFrame(render);
            }

            // --- ИНТЕРАКТИВНОЕ УПРАВЛЕНИЕ (МЫШЬ И СЕНСОРНЫЙ ЭКРАН) ---

            canvas.addEventListener('mousedown', (e) => {
                state.isDragging = true;
                state.lastX = e.clientX;
                state.lastY = e.clientY;
                state.velX = 0;
                state.velY = 0;
            });

            window.addEventListener('mousemove', (e) => {
                if (!state.isDragging) return;
                const dx = e.clientX - state.lastX;
                const dy = e.clientY - state.lastY;
                state.lastX = e.clientX;
                state.lastY = e.clientY;

                state.velX = dx * 0.007;
                state.velY = dy * 0.007;
                state.rotY += state.velX;
                state.rotX = Math.max(-1.2, Math.min(1.35, state.rotX + state.velY));
            });

            window.addEventListener('mouseup', () => {
                state.isDragging = false;
            });

            // Масштабирование колесом мыши
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.92 : 1.08;
                state.zoom = Math.max(0.45, Math.min(2.6, state.zoom * delta));
            }, { passive: false });

            // Поддержка касаний и щипка (pinch-to-zoom) на смартфонах
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    state.isDragging = true;
                    state.lastX = e.touches[0].clientX;
                    state.lastY = e.touches[0].clientY;
                    state.velX = 0;
                    state.velY = 0;
                } else if (e.touches.length === 2) {
                    state.isDragging = false;
                    state.lastPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && state.isDragging) {
                    const dx = e.touches[0].clientX - state.lastX;
                    const dy = e.touches[0].clientY - state.lastY;
                    state.lastX = e.touches[0].clientX;
                    state.lastY = e.touches[0].clientY;

                    state.velX = dx * 0.008;
                    state.velY = dy * 0.008;
                    state.rotY += state.velX;
                    state.rotX = Math.max(-1.2, Math.min(1.35, state.rotX + state.velY));
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (state.lastPinchDist > 0) {
                        const scaleFactor = dist / state.lastPinchDist;
                        state.zoom = Math.max(0.45, Math.min(2.6, state.zoom * scaleFactor));
                    }
                    state.lastPinchDist = dist;
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => {
                state.isDragging = false;
                state.lastPinchDist = 0;
            });

            // --- ЭЛЕМЕНТЫ ПАНЕЛИ НАСТРОЕК ---

            const toggleBtn = document.getElementById('toggleControlsBtn');
            const controlsPanel = document.getElementById('controlsPanel');
            const speedSlider = document.getElementById('speedSlider');
            const speedVal = document.getElementById('speedVal');
            const fontSizeSlider = document.getElementById('fontSizeSlider');
            const fontSizeVal = document.getElementById('fontSizeVal');
            const resetViewBtn = document.getElementById('resetViewBtn');
            const paletteBtns = document.querySelectorAll('.palette-btn');

            toggleBtn.addEventListener('click', () => {
                controlsPanel.classList.toggle('controls-hidden');
            });

            speedSlider.addEventListener('input', (e) => {
                state.autoSpeed = parseFloat(e.target.value);
                speedVal.textContent = `${state.autoSpeed.toFixed(1)}x`;
            });

            fontSizeSlider.addEventListener('input', (e) => {
                state.fontSize = parseInt(e.target.value, 10);
                fontSizeVal.textContent = `${state.fontSize}px`;
                resizeCanvas();
            });

            resetViewBtn.addEventListener('click', () => {
                state.rotX = 0.38;
                state.rotY = 0.0;
                state.rotZ = -0.12;
                state.zoom = 1.0;
                state.velX = 0;
                state.velY = 0;
            });

            paletteBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    state.palette = btn.dataset.palette;
                    paletteBtns.forEach(b => {
                        b.className = 'palette-btn py-1.5 rounded-lg bg-white/5 border border-white/10 text-neutral-400 transition';
                    });
                    if (state.palette === 'crimson') {
                        btn.className = 'palette-btn py-1.5 rounded-lg bg-rose-500/20 border border-rose-500/50 text-rose-300 font-medium';
                    } else if (state.palette === 'pink') {
                        btn.className = 'palette-btn py-1.5 rounded-lg bg-pink-500/20 border border-pink-500/50 text-pink-300 font-medium';
                    } else {
                        btn.className = 'palette-btn py-1.5 rounded-lg bg-amber-500/20 border border-amber-500/50 text-amber-300 font-medium';
                    }
                });
            });

            window.addEventListener('resize', resizeCanvas);

            // Инициализация модели, холста и запуск анимации
            buildRoseGeometry();
            resizeCanvas();
            requestAnimationFrame(render);
        };
    </script>
</body>
</html>
